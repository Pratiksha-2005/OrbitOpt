services:
  # PostgreSQL Database Service for Containerized Environment
  db:
    image: postgres:16-alpine
    container_name: orbitopt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-orbitopt_dev}
    ports:
      # Exposed on 5433 to prevent collision with local native PostgreSQL on port 5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orbitopt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orbitopt_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Optimization & Persistence Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbitopt_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-orbitopt_dev}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-orbitopt_dev}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # Mount datasets as read-only for SatNet scenario processing
      - ./datasets:/app/datasets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # React + Vite Dashboard Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbitopt_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  orbitopt_pgdata:
    driver: local
